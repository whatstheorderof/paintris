<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0b0a12"/>
  <!-- an O-tetromino of wet paint, one colour per block -->
  <rect x="10" y="10" width="21" height="21" rx="5" fill="#e5344a"/>
  <rect x="33" y="10" width="21" height="21" rx="5" fill="#f7c948"/>
  <rect x="10" y="33" width="21" height="21" rx="5" fill="#2f7fe8"/>
  <rect x="33" y="33" width="21" height="21" rx="5" fill="#3ec96e"/>
  <!-- glossy top edge -->
  <rect x="13" y="13" width="15" height="5" rx="2.5" fill="#fff" opacity=".38"/>
  <rect x="36" y="13" width="15" height="5" rx="2.5" fill="#fff" opacity=".38"/>
  <!-- a drip running off the bottom -->
  <path d="M41 54c0 5 3 6 3 9 0 2-1.4 3-3 3s-3-1-3-3c0-3 3-4 3-9z" fill="#3ec96e"/>
</svg>
